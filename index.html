<!DOCTYPE html>
<html lang="en">
<head>

<link rel="apple-touch-icon" href="easy browser.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Browser</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <<script src="script.js"></script>

        <div class="logoBox">

            <h1>Easy Browser</h1>

            <button id="continueBtn">
                Continue
            </button>

            <div class="loader">
                <span></span>
            </div>

        </div>

    </div>

    <!-- ===================== -->
    <!-- Home Screen -->
    <!-- ===================== -->

    <div id="home">

        <header class="header">

            <img src="easy browser.jpeg" class="logo mediumLogo">

            <p>Open your favorite websites</p>

        </header>

        <main>

            <div id="appList">

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</html>
