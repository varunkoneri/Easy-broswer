<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy-browser</title>
<style>
*{box-sizing:border-box;}
html,body{
  margin:0;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{
  background: radial-gradient(circle at 15% 10%, #1b3a66, transparent 45%), linear-gradient(160deg, #0a1a33 0%, #050c1a 60%, #020509 100%);
  color:#eef2fb;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:64px 20px 40px;
  transition:background .3s ease;
}
body[data-theme="navy"]{
  background: radial-gradient(circle at 15% 10%, #1b3a66, transparent 45%), linear-gradient(160deg, #0a1a33 0%, #050c1a 60%, #020509 100%);
}
body[data-theme="midnight"]{
  background: radial-gradient(circle at 15% 10%, #3a1f66, transparent 45%), linear-gradient(160deg, #1a1033 0%, #0c0819 60%, #030209 100%);
}
body[data-theme="forest"]{
  background: radial-gradient(circle at 15% 10%, #1e6b45, transparent 45%), linear-gradient(160deg, #0d2418 0%, #081410 60%, #020806 100%);
}
body[data-theme="sunset"]{
  background: radial-gradient(circle at 15% 10%, #8a3a2b, transparent 45%), linear-gradient(160deg, #3a1b1b 0%, #1f0f0f 60%, #0a0505 100%);
}
body[data-theme="slate"]{
  background: radial-gradient(circle at 15% 10%, #4a5568, transparent 45%), linear-gradient(160deg, #20242c 0%, #14161c 60%, #08090b 100%);
}

.theme-switcher{
  position:fixed;
  top:18px;
  right:20px;
  display:flex;
  gap:10px;
  z-index:10;
  align-items:center;
}
.theme-dot{
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.35);
  cursor:pointer;
  padding:0;
  transition:transform .15s ease, border-color .15s ease;
}
.theme-dot:hover{transform:scale(1.12);} 
.theme-dot.active{border-color:#ffffff;}

.icon-btn{
  background:none;
  border:none;
  color:#c7d1e8;
  cursor:pointer;
  display:flex;
  align-items:center;
  padding:4px;
}
.icon-btn:hover{color:#ffffff;}

.user-badge{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  padding:6px 10px;
  border-radius:999px;
  color:#eef2fb;
  cursor:pointer;
}
.user-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.16)}

.search-wrap{
  width:100%;
  max-width:640px;
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.22);
  border-radius:999px;
  padding:14px 22px;
  backdrop-filter:blur(6px);
}
.search-wrap input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#eef2fb;
  font-size:17px;
}
.search-wrap input::placeholder{color:#c7d1e8;}

.grid{
  margin-top:56px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:28px 20px;
  max-width:600px;
  width:100%;
}
.app{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#eef2fb;
}
.tile{
  width:64px;
  height:64px;
  border-radius:18px;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.45);
  transition:transform .15s ease;
}
.app:hover .tile{transform:translateY(-3px) scale(1.04);} 
.label{font-size:13px; color:#eef2fb; opacity:0.95; text-shadow:0 1px 3px rgba(0,0,0,0.5);} 
.tile img{width:34px;height:34px;}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(4,1fr); gap:20px 12px;}
  .tile{width:52px;height:52px;border-radius:14px;}
  .tile img{width:28px;height:28px;}
}

/* Splash */
#splashScreen{
  position:fixed;
  inset:0;
  background:#050b18;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  z-index:9999;
  transition:opacity 0.6s ease;
  padding:20px;
}
#splashScreen img{
  width:120px;
  height:120px;
  border-radius:28px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  animation:splashPulse 1.6s ease-in-out infinite;
}
#splashScreen.fade-out{
  opacity:0;
  pointer-events:none;
}
@keyframes splashPulse{
  0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.splash-text{ color:#eef2fb; font-size:19px; font-weight:500; text-align:center; margin:0; }
#nameStep{ display:flex; flex-direction:column; align-items:center; gap:14px; }
#nameInput{ width:240px; padding:12px 16px; border-radius:999px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.08); color:#eef2fb; font-size:15px; text-align:center; outline:none; }
#nameInput::placeholder{color:#9db0cf;}
#nameSubmit{ padding:10px 26px; border-radius:999px; border:none; background:#3d7fe0; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
#nameSubmit:hover{background:#5a93e8;} 
#welcomeStep .splash-text{font-size:22px; font-weight:600;} #welcomeStep{display:flex; align-items:center; justify-content:center;}

/* Auth modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:10000}
.modal{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.12);padding:20px;border-radius:14px;max-width:420px;width:94%;color:#eef2fb}
.modal h3{margin:0 0 8px 0}
.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#eef2fb;margin-bottom:10px}
.modal .row{display:flex;gap:8px}
.btn{padding:10px 14px;border-radius:10px;border:none;background:#3d7fe0;color:#fff;cursor:pointer}
.btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.12)}
.profile-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.12);margin:8px auto;display:block}
.small{font-size:13px;color:#c7d1e8}

</style>
</head>
<body data-theme="navy">

  <div class="theme-switcher">
    <div id="themeDots" style="display:flex;gap:8px;align-items:center">
      <button class="theme-dot" data-theme="navy" title="Navy" style="background:#1b3a66"></button>
      <button class="theme-dot" data-theme="midnight" title="Midnight" style="background:#3a1f66"></button>
      <button class="theme-dot" data-theme="forest" title="Forest" style="background:#1e6b45"></button>
      <button class="theme-dot" data-theme="sunset" title="Sunset" style="background:#8a3a2b"></button>
    </div>

    <div id="userArea">
      <!-- will be populated by JS: login/register or user badge -->
      <button id="showAuthBtn" class="user-badge" title="Sign in or Register">
        <img src="icon-512.png" class="user-avatar" alt="avatar">
        <span id="userNameLabel">Sign in</span>
      </button>
    </div>
  </div>

  <div id="splashScreen">
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBYRXhpZgAATU0AKgAAAAgAAgESAAMAAAABAAEAAIdpAAQAAAABAAAAJgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAABQKADAAQAAAABAAABQAAAAAD/wAARCAFAAU[...]" alt="logo">

    <div id="nameStep">
      <p class="splash-text">What should we call you?</p>
      <input type="text" id="nameInput" placeholder="Your name" autocomplete="off" />
      <button id="nameSubmit">Continue</button>
    </div>

    <div id="welcomeStep" style="display:none;">
      <p class="splash-text" id="welcomeText"></p>
    </div>
  </div>

  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9db0cf" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search or type web address" />
    <button class="icon-btn" aria-label="Bookmark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
    </button>
    <button class="icon-btn" id="menuBtn" aria-label="Change background">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <div class="grid">

    <!-- many app tiles omitted for brevity - original list preserved -->
    <a class="app" href="https://mail.google.com" target="_blank" rel="noopener noreferrer">
      <div class="tile"> ... </div>
      <span class="label">Gmail</span>
    </a>
    <!-- rest of tiles kept as in the original file -->

  </div>

  <!-- Auth modal -->
  <div class="modal-backdrop" id="authBackdrop">
    <div class="modal" id="authModal">
      <div id="authViews">
        <div id="loginView">
          <h3>Sign in</h3>
          <input id="loginUser" class="input" placeholder="Username" autocomplete="username">
          <input id="loginPass" class="input" type="password" placeholder="Password" autocomplete="current-password">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button id="toRegister" class="btn secondary">Create account</button>
            <button id="loginBtn" class="btn">Sign in</button>
          </div>
          <p class="small" style="margin-top:8px">Passwords are hashed locally (SHA-256). This is a simple local demo — not secure for production.</p>
        </div>

        <div id="registerView" style="display:none">
          <h3>Create account</h3>
          <input id="regUser" class="input" placeholder="Choose a username (no spaces)" autocomplete="username">
          <input id="regPass" class="input" type="password" placeholder="Password" autocomplete="new-password">
          <input id="regDisplay" class="input" placeholder="Display name (optional)">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button id="toLogin" class="btn secondary">Back</button>
            <button id="registerBtn" class="btn">Create</button>
          </div>
          <p class="small" style="margin-top:8px">Accounts are stored locally in your browser only.</p>
        </div>

        <div id="profileView" style="display:none">
          <h3>Your profile</h3>
          <img id="profileAvatar" src="icon-512.png" class="profile-avatar" alt="avatar">
          <input id="avatarInput" type="file" accept="image/*" class="input">
          <input id="profileDisplay" class="input" placeholder="Display name">
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button id="closeProfile" class="btn secondary">Close</button>
            <button id="saveProfile" class="btn">Save</button>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-between;margin-top:12px">
            <button id="logoutBtn" class="btn secondary">Log out</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
// --- Existing splash/name logic preserved ---
const splashScreen = document.getElementById('splashScreen');
const nameStep = document.getElementById('nameStep');
const welcomeStep = document.getElementById('welcomeStep');
const nameInput = document.getElementById('nameInput');
const nameSubmit = document.getElementById('nameSubmit');
const welcomeText = document.getElementById('welcomeText');

function hideSplash() {
  splashScreen.classList.add('fade-out');
  setTimeout(function () { splashScreen.style.display = 'none'; }, 600);
}
function showWelcome(name) {
  nameStep.style.display = 'none';
  welcomeText.textContent = 'Welcome ' + name + ', Easy Browser welcomes you!';
  welcomeStep.style.display = 'flex';
  setTimeout(hideSplash, 2200);
}

let savedName = '';
try { savedName = localStorage.getItem('easyBrowserName') || ''; } catch (e) {}

// --- New: user system ---
const USERS_KEY = 'easyBrowser_users';
const CURRENT_KEY = 'easyBrowser_current';

function safeGetJSON(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){return null;} }
function safeSetJSON(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){} }

async function sha256hex(text){
  const enc = new TextEncoder();
  const data = enc.encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  const bytes = new Uint8Array(hash);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function getUsers(){ return safeGetJSON(USERS_KEY) || {}; }
function setUsers(u){ safeSetJSON(USERS_KEY, u); }
function setCurrent(username){ try{ localStorage.setItem(CURRENT_KEY, username); }catch(e){} updateUserBadge(); }
function getCurrent(){ return localStorage.getItem(CURRENT_KEY) || null; }
function clearCurrent(){ try{ localStorage.removeItem(CURRENT_KEY); }catch(e){} updateUserBadge(); }

// UI elements for auth
const authBackdrop = document.getElementById('authBackdrop');
const showAuthBtn = document.getElementById('showAuthBtn');
const loginView = document.getElementById('loginView');
const registerView = document.getElementById('registerView');
const profileView = document.getElementById('profileView');
const toRegister = document.getElementById('toRegister');
const toLogin = document.getElementById('toLogin');
const loginBtn = document.getElementById('loginBtn');
const registerBtn = document.getElementById('registerBtn');
const logoutBtn = document.getElementById('logoutBtn');
const userNameLabel = document.getElementById('userNameLabel');
const profileAvatar = document.getElementById('profileAvatar');
const avatarInput = document.getElementById('avatarInput');
const profileDisplay = document.getElementById('profileDisplay');
const saveProfile = document.getElementById('saveProfile');
const closeProfile = document.getElementById('closeProfile');

function openAuth(view){ authBackdrop.style.display='flex'; loginView.style.display='none'; registerView.style.display='none'; profileView.style.display='none';
  if(view==='login') loginView.style.display='block';
  if(view==='register') registerView.style.display='block';
  if(view==='profile') profileView.style.display='block';
}

authBackdrop.addEventListener('click', function(e){ if(e.target===authBackdrop) authBackdrop.style.display='none'; });

showAuthBtn.addEventListener('click', function(){
  const cur = getCurrent();
  if(cur) openAuth('profile'); else openAuth('login');
});

toRegister.addEventListener('click', function(){ openAuth('register'); });
toLogin.addEventListener('click', function(){ openAuth('login'); });

// Register
registerBtn.addEventListener('click', async function(){
  const username = (document.getElementById('regUser').value||'').trim();
  const pass = (document.getElementById('regPass').value||'').trim();
  const display = (document.getElementById('regDisplay').value||'').trim();
  if(!username || username.indexOf(' ')>=0){ alert('Choose a valid username (no spaces)'); return; }
  if(pass.length < 4){ alert('Pick a longer password'); return; }
  const users = getUsers();
  if(users[username]){ alert('Username already exists'); return; }
  const hash = await sha256hex(pass);
  users[username] = { passwordHash: hash, displayName: display || username, photo: null };
  setUsers(users);
  setCurrent(username);
  authBackdrop.style.display='none';
  updateUserBadge();
  showWelcome(users[username].displayName);
});

// Login
loginBtn.addEventListener('click', async function(){
  const username = (document.getElementById('loginUser').value||'').trim();
  const pass = (document.getElementById('loginPass').value||'').trim();
  if(!username || !pass){ alert('Enter username and password'); return; }
  const users = getUsers();
  const user = users[username];
  if(!user){ alert('No such user'); return; }
  const hash = await sha256hex(pass);
  if(hash !== user.passwordHash){ alert('Incorrect password'); return; }
  setCurrent(username);
  authBackdrop.style.display='none';
  updateUserBadge();
  showWelcome(user.displayName || username);
});

// Profile save
saveProfile.addEventListener('click', function(){
  const cur = getCurrent(); if(!cur) return;
  const users = getUsers(); if(!users[cur]) return;
  users[cur].displayName = profileDisplay.value.trim() || cur;
  if(profileAvatar.dataset.pending) users[cur].photo = profileAvatar.src; // already set when picked
  setUsers(users);
  profileAvatar.dataset.pending = '';
  authBackdrop.style.display='none';
  updateUserBadge();
});

closeProfile.addEventListener('click', function(){ authBackdrop.style.display='none'; });

// Logout
logoutBtn.addEventListener('click', function(){ if(confirm('Log out?')){ clearCurrent(); authBackdrop.style.display='none'; } });

// Avatar upload
avatarInput.addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = function(){ profileAvatar.src = reader.result; profileAvatar.dataset.pending = '1'; };
  reader.readAsDataURL(f);
});

// Update user badge
function updateUserBadge(){
  const cur = getCurrent();
  const users = getUsers();
  const btn = document.getElementById('showAuthBtn');
  const avatar = btn.querySelector('.user-avatar');
  const label = document.getElementById('userNameLabel');
  if(cur && users[cur]){
    label.textContent = users[cur].displayName || cur;
    if(users[cur].photo) avatar.src = users[cur].photo; else avatar.src = 'icon-512.png';
  } else { label.textContent = 'Sign in'; avatar.src = 'icon-512.png'; }
}

// When opening profile view, populate fields
function openProfileForCurrent(){
  const cur = getCurrent(); if(!cur) return;
  const users = getUsers(); const user = users[cur]; if(!user) return;
  profileAvatar.src = user.photo || 'icon-512.png';
  profileDisplay.value = user.displayName || cur;
}

// When clicking 'showAuthBtn' while logged in, open profile with data
document.getElementById('showAuthBtn').addEventListener('click', function(){ if(getCurrent()){ openProfileForCurrent(); openAuth('profile'); } });

// --- Existing background & search logic preserved ---
const backgrounds = [
  'radial-gradient(circle at 15% 10%, #1b3a66, transparent 45%), linear-gradient(160deg, #0a1a33 0%, #050c1a 60%, #020509 100%)',
  'radial-gradient(circle at 85% 15%, #4a1b66, transparent 45%), linear-gradient(160deg, #2a0a33 0%, #0c0518 60%, #050208 100%)',
  'radial-gradient(circle at 20% 80%, #0a4d3a, transparent 45%), linear-gradient(160deg, #05261e 0%, #051510 60%, #020a08 100%)',
  'radial-gradient(circle at 80% 80%, #663d0a, transparent 45%), linear-gradient(160deg, #331f05 0%, #1a1004 60%, #0a0802 100%)',
  'radial-gradient(circle at 50% 20%, #66102a, transparent 45%), linear-gradient(160deg, #33081a 0%, #18040c 60%, #0a0206 100%)'
];

const menuBtn = document.getElementById('menuBtn');
const searchInput = document.getElementById('searchInput');
const appTiles = Array.from(document.querySelectorAll('.app'));

let bgIndex = 0;
try { bgIndex = parseInt(localStorage.getItem('koneriBgIndex') || '0', 10) || 0; } catch (e) {}
function applyBackground(index) { document.body.style.background = backgrounds[index]; }
applyBackground(bgIndex);
menuBtn.addEventListener('click', function () { bgIndex = (bgIndex + 1) % backgrounds.length; applyBackground(bgIndex); try { localStorage.setItem('koneriBgIndex', String(bgIndex)); } catch (e) {} });

// Live-filter the app grid as the user types
searchInput.addEventListener('input', function () {
  const query = searchInput.value.trim().toLowerCase();
  appTiles.forEach(function (tile) {
    const label = tile.querySelector('.label').textContent.toLowerCase();
    const matches = query === '' || label.includes(query);
    tile.style.display = matches ? '' : 'none';
  });
});

searchInput.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const value = searchInput.value.trim(); if (!value) return;
  const visibleTiles = appTiles.filter(function (tile) { return tile.style.display !== 'none'; });
  if (visibleTiles.length === 1) { window.open(visibleTiles[0].getAttribute('href'), '_blank', 'noopener,noreferrer'); return; }
  const looksLikeUrl = /^(https?:\/\/)?[^\s]+\.[a-z]{2,}([/?#].*)?$/i.test(value);
  let destination;
  if (looksLikeUrl) { destination = value.startsWith('http') ? value : 'https://' + value; } else { destination = 'https://www.google.com/search?q=' + encodeURIComponent(value); }
  window.open(destination, '_blank', 'noopener,noreferrer');
});

// Initialization: if user logged in, use their display name for welcome and avatar
if (getCurrent()) {
  const users = getUsers(); const cur = getCurrent(); const u = users[cur]; if(u){ try{ localStorage.setItem('easyBrowserName', u.displayName || cur); }catch(e){} }
}

if (savedName || getCurrent()) {
  const nameToShow = getCurrent() ? (getUsers()[getCurrent()]?.displayName || getCurrent()) : savedName;
  showWelcome(nameToShow);
} else {
  nameSubmit.addEventListener('click', function () {
    const name = nameInput.value.trim() || 'friend';
    try { localStorage.setItem('easyBrowserName', name); } catch (e) {}
    showWelcome(name);
  });
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') nameSubmit.click(); });
  nameInput.focus();
}

// wire auth badge initially
updateUserBadge();

</script>
</body>
</html>
