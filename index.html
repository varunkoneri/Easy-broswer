<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koneri</title>
<style>
*{box-sizing:border-box;}
html,body{
  margin:0;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{
  background: radial-gradient(circle at 15% 10%, #1b3a66, transparent 45%), linear-gradient(160deg, #0a1a33 0%, #050c1a 60%, #020509 100%);
  color:#eef2fb;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:64px 20px 40px;
  transition:background .3s ease;
}
body[data-theme="navy"]{
  background: radial-gradient(circle at 15% 10%, #1b3a66, transparent 45%), linear-gradient(160deg, #0a1a33 0%, #050c1a 60%, #020509 100%);
}
body[data-theme="midnight"]{
  background: radial-gradient(circle at 15% 10%, #3a1f66, transparent 45%), linear-gradient(160deg, #1a1033 0%, #0c0819 60%, #030209 100%);
}
body[data-theme="forest"]{
  background: radial-gradient(circle at 15% 10%, #1e6b45, transparent 45%), linear-gradient(160deg, #0d2418 0%, #081410 60%, #020806 100%);
}
body[data-theme="sunset"]{
  background: radial-gradient(circle at 15% 10%, #8a3a2b, transparent 45%), linear-gradient(160deg, #3a1b1b 0%, #1f0f0f 60%, #0a0505 100%);
}
body[data-theme="slate"]{
  background: radial-gradient(circle at 15% 10%, #4a5568, transparent 45%), linear-gradient(160deg, #20242c 0%, #14161c 60%, #08090b 100%);
}

.theme-switcher{
  position:fixed;
  top:18px;
  right:20px;
  display:flex;
  gap:10px;
  z-index:10;
}
.theme-dot{
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.35);
  cursor:pointer;
  padding:0;
  transition:transform .15s ease, border-color .15s ease;
}
.theme-dot:hover{transform:scale(1.12);}
.theme-dot.active{border-color:#ffffff;}

.search-wrap{
  width:100%;
  max-width:640px;
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.22);
  border-radius:999px;
  padding:14px 22px;
  backdrop-filter:blur(6px);
}
.search-wrap input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#eef2fb;
  font-size:17px;
}
.search-wrap input::placeholder{color:#c7d1e8;}

.icon-btn{
  background:none;
  border:none;
  color:#c7d1e8;
  cursor:pointer;
  display:flex;
  align-items:center;
  padding:4px;
}
.icon-btn:hover{color:#ffffff;}

.grid{
  margin-top:56px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:28px 20px;
  max-width:600px;
  width:100%;
}
.app{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#eef2fb;
}
.tile{
  width:64px;
  height:64px;
  border-radius:18px;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.45);
  transition:transform .15s ease;
}
.app:hover .tile{transform:translateY(-3px) scale(1.04);}
.label{font-size:13px; color:#eef2fb; opacity:0.95; text-shadow:0 1px 3px rgba(0,0,0,0.5);}
.tile img{width:34px;height:34px;}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(4,1fr); gap:20px 12px;}
  .tile{width:52px;height:52px;border-radius:14px;}
  .tile img{width:28px;height:28px;}
}

</style>
<style>
#splashScreen{
  position:fixed;
  inset:0;
  background:#050b18;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity 0.6s ease;
}
#splashScreen img{
  width:160px;
  height:160px;
  border-radius:36px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  animation:splashPulse 1.6s ease-in-out infinite;
}
#splashScreen.fade-out{
  opacity:0;
  pointer-events:none;
}
@keyframes splashPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);}
}
</style>

const backgrounds = [
  'radial-gradient(circle at 15% 10%, #1b3a66, transparent 45%), linear-gradient(160deg, #0a1a33 0%, #050c1a 60%, #020509 100%)',
  'radial-gradient(circle at 85% 15%, #4a1b66, transparent 45%), linear-gradient(160deg, #2a0a33 0%, #0c0518 60%, #050208 100%)',
  'radial-gradient(circle at 20% 80%, #0a4d3a, transparent 45%), linear-gradient(160deg, #05261e 0%, #051510 60%, #020a08 100%)',
  'radial-gradient(circle at 80% 80%, #663d0a, transparent 45%), linear-gradient(160deg, #331f05 0%, #1a1004 60%, #0a0802 100%)',
  'radial-gradient(circle at 50% 20%, #66102a, transparent 45%), linear-gradient(160deg, #33081a 0%, #18040c 60%, #0a0206 100%)'
];

const menuBtn = document.getElementById('menuBtn');
const searchInput = document.getElementById('searchInput');
const appTiles = Array.from(document.querySelectorAll('.app'));

let bgIndex = 0;
try {
  bgIndex = parseInt(localStorage.getItem('koneriBgIndex') || '0', 10) || 0;
} catch (e) {}

function applyBackground(index) {
  document.body.style.background = backgrounds[index];
}

applyBackground(bgIndex);

menuBtn.addEventListener('click', function () {
  bgIndex = (bgIndex + 1) % backgrounds.length;
  applyBackground(bgIndex);
  try { localStorage.setItem('koneriBgIndex', String(bgIndex)); } catch (e) {}
});

// Live-filter the app grid as the user types
searchInput.addEventListener('input', function () {
  const query = searchInput.value.trim().toLowerCase();

  appTiles.forEach(function (tile) {
    const label = tile.querySelector('.label').textContent.toLowerCase();
    const matches = query === '' || label.includes(query);
    tile.style.display = matches ? '' : 'none';
  });
});

searchInput.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;

  const value = searchInput.value.trim();
  if (!value) return;

  // If exactly one app matches what's typed, Enter opens that app directly
  const visibleTiles = appTiles.filter(function (tile) {
    return tile.style.display !== 'none';
  });
  if (visibleTiles.length === 1) {
    window.open(visibleTiles[0].getAttribute('href'), '_blank', 'noopener,noreferrer');
    return;
  }

  const looksLikeUrl = /^(https?:\/\/)?[^\s]+\.[a-z]{2,}([/?#].*)?$/i.test(value);

  let destination;
  if (looksLikeUrl) {
    destination = value.startsWith('http') ? value : 'https://' + value;
  } else {
    destination = 'https://www.google.com/search?q=' + encodeURIComponent(value);
  }

  window.open(destination, '_blank', 'noopener,noreferrer');
});

</script>
</body>
</html>
